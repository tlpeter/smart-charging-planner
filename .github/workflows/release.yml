name: Release

# Makes the GitHub release for a stable version (AGENTS.md › GitHub releases).
# Runs by itself after the Tests workflow passed for a push to main. It only
# makes a release when all of this is true for that commit:
#  - the version in config.yaml is stable (X.Y.Z, no -dev);
#  - there is no tag vX.Y.Z yet;
#  - release-notes/vX.Y.Z.md exists;
#  - the Home Assistant Core compatibility check for the same commit passed.
# Otherwise it does nothing (for example a push to main that is not a new
# version). Then: the tag vX.Y.Z on that commit, the release with those notes
# and the release zip, and the milestone X.Y.Z is closed.
# "Run workflow" (Actions tab) does the same for the newest commit on main.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Is this a new stable version?
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' smart_charging_planner/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          TAG="v$VERSION"
          echo "Commit $SHA, version $VERSION"
          go=true
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable version: no release"; go=false
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists already: no release"; go=false
          elif [ ! -s "release-notes/$TAG.md" ]; then
            echo "::error::release-notes/$TAG.md is missing: write it, then use Run workflow"; exit 1
          elif ! git branch -r --contains "$SHA" | grep -qE '^[[:space:]]*origin/main$'; then
            echo "::error::$SHA is not on main"; exit 1
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for the Home Assistant Core check of this commit
        if: steps.check.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            R=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "Home Assistant Core compatibility")] | sort_by(.created_at) | last | "\(.status) \(.conclusion)"')
            echo "Core check: $R"
            case "$R" in
              "completed success") exit 0 ;;
              completed*) echo "::error::The Home Assistant Core check did not pass: no release"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::The Home Assistant Core check did not finish in time"; exit 1

      - name: Build the zip
        if: steps.check.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -o "smart-charging-planner-${{ steps.check.outputs.tag }}.zip" "${SHA}:smart_charging_planner"
          unzip -l "smart-charging-planner-${{ steps.check.outputs.tag }}.zip" | tail -1

      - name: Create the tag and the release
        if: steps.check.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          gh release create "$TAG" "smart-charging-planner-$TAG.zip" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file "release-notes/$TAG.md" \
            --latest

      - name: Close the milestone
        if: steps.check.outputs.go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.check.outputs.version }}"
          N=$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" --jq ".[] | select(.title == \"$V\") | .number" | head -1)
          if [ -n "$N" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/$N" -f state=closed --silent
            echo "Milestone $V closed"
          else
            echo "No open milestone $V"
          fi

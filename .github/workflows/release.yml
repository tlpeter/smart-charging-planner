name: Release

# Makes the GitHub release for a stable version (AGENTS.md › GitHub releases).
# Starts when a tag like v0.35.0 is pushed. That happens only after
# "uitbrengen", on the release commit of main, once the tests on main are green.
#
# Checks first, and stops without a release when something is wrong:
#  - the tag is vX.Y.Z (no -dev) and is the version in config.yaml;
#  - the tagged commit is on main;
#  - release-notes/vX.Y.Z.md exists in that commit.
# Then: the zip (the contents of smart_charging_planner, no top folder), the
# release with those notes, and the milestone X.Y.Z is closed.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag, the version and the notes
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a stable version tag (vX.Y.Z, no -dev)"; exit 1
          fi
          VERSION="${TAG#v}"
          CONFIG=$(grep -m1 '^version:' smart_charging_planner/config.yaml | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          if [ "$CONFIG" != "$VERSION" ]; then
            echo "::error::config.yaml has version $CONFIG, the tag is $TAG"; exit 1
          fi
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '^[[:space:]]*origin/main$'; then
            echo "::error::$TAG is not on main"; exit 1
          fi
          NOTES="release-notes/$TAG.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing in this commit"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip -o "smart-charging-planner-${GITHUB_REF_NAME}.zip" "${GITHUB_SHA}:smart_charging_planner"
          unzip -l "smart-charging-planner-${GITHUB_REF_NAME}.zip" | tail -1

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "smart-charging-planner-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.check.outputs.notes }}" \
            --verify-tag \
            --latest

      - name: Close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          N=$(gh api "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${{ steps.check.outputs.version }}\") | .number" | head -1)
          if [ -n "$N" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/milestones/$N" -f state=closed --silent
            echo "Milestone ${{ steps.check.outputs.version }} closed"
          else
            echo "No open milestone ${{ steps.check.outputs.version }}"
          fi

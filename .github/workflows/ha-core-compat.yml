name: Home Assistant Core compatibility

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/ha-core-compat.yml'
      - 'smart_charging_planner/app/**'
      - 'tests/ha-core/**'
      - 'tests/ha-core-compat.test.js'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  compatibility:
    # The current Core and the oldest one the app is checked against (#28).
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: ['2026.10.4', '2026.4.2']
    env:
      HA_CORE_VERSION: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - name: Start Home Assistant Core ${{ matrix.core }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ha-core-config"
          cp tests/ha-core/configuration.yaml "$RUNNER_TEMP/ha-core-config/configuration.yaml"
          docker run --detach --name scp-ha-core \
            --publish 8123:8123 \
            --volume "$RUNNER_TEMP/ha-core-config:/config" \
            "ghcr.io/home-assistant/home-assistant:${HA_CORE_VERSION}"
      - name: Test Smart Charging Planner against real Core
        run: node tests/ha-core-compat.test.js
      - name: Home Assistant log on failure
        if: failure()
        run: docker logs scp-ha-core
      - name: Stop Home Assistant
        if: always()
        run: docker rm --force scp-ha-core

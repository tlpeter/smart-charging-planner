name: Tests

# Runs every test on each push and pull request. A red result means: do not
# release this version.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, persistence, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - name: Check JavaScript syntax
        shell: bash
        run: find smart_charging_planner/app tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node tests/persistence.test.js
      - name: Critical-module coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='smart_charging_planner/app/*.js'
          --test-coverage-lines=40
          --test-coverage-functions=40
          --test-coverage-branches=30
          tests/brands.test.js tests/cars.test.js tests/solar.test.js tests/battery.test.js tests/reliability.test.js tests/chargestate.test.js tests/carplace.test.js tests/notify.test.js tests/activecar.test.js tests/sharing.test.js tests/tripcost.test.js tests/routing.test.js tests/chargestops.test.js tests/precondition.test.js tests/pricebasis.test.js tests/batteryguard.test.js tests/diagnostics.test.js tests/page.test.js

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - name: Run the unit tests
        run: node tests/testplan.js unit results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-unit
          path: results/

  settings:
    name: Settings test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [renault_easee, skoda_wallbox, kia_zaptec]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - run: mkdir -p results && node tests/settings.test.js
        env:
          SCP_PROFILE: ${{ matrix.profile }}
          SCP_RESULTS: results/settings-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-settings-${{ matrix.profile }}
          path: results/

  matrix:
    name: Matrix (${{ matrix.charger }} × all batteries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        charger: ['Easee', 'Zaptec', 'Alfen', 'Wallbox', 'go-e (marq24)', 'go-e (cathiele)', 'Peblar', 'OCPP', 'Ohme', 'Tesla Wall']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - run: mkdir -p results && node tests/matrix.test.js
        env:
          SCP_CHARGERS: ${{ matrix.charger }}
          SCP_RESULTS: results/matrix-${{ strategy.job-index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-matrix-${{ strategy.job-index }}
          path: results/

  cars:
    name: Cars (every car integration × Easee)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smart_charging_planner/app
      - run: mkdir -p results && node tests/matrix.test.js
        env:
          SCP_CARS: all
          SCP_CHARGERS: none
          SCP_RESULTS: results/matrix-cars.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-matrix-cars
          path: results/

  testplan:
    name: Update the test plan
    # After every push: write tests/TESTPLAN.md from the results above and
    # save it in the branch when it changed. Also when a test failed, so the
    # plan shows what failed.
    needs: [unit, settings, matrix, cars]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Write TESTPLAN.md
        run: node tests/testplan.js write results
      - name: Save TESTPLAN.md in the branch
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- tests/TESTPLAN.md; then
            echo "The test plan did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/TESTPLAN.md
          git commit -m "Test plan: results of ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            remote_head="$(git rev-parse "refs/remotes/origin/${GITHUB_REF_NAME}")"
            if [ "$remote_head" != "$GITHUB_SHA" ]; then
              echo "Newer code is on the branch; its workflow will publish the test plan."
              exit 0
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

  container:
    name: Container build (amd64, aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image for both architectures in config.yaml
        uses: docker/build-push-action@v6
        with:
          context: smart_charging_planner
          platforms: linux/amd64,linux/arm64
          push: false
      - name: The app starts in the image
        shell: bash
        run: |
          docker build -t scp-check smart_charging_planner
          docker run --rm --entrypoint sh scp-check -c "node --check server.js && node -e \"require('ws'); console.log('app and its packages are in the image, node', process.version)\""


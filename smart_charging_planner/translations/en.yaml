configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log. Use debug when reporting a problem.
  allow_control:
    name: Allow control
    description: >-
      Master switch, off by default. When off, the app only shows advice and
      never changes your charger, vehicle or home battery. When on, the app
      starts and pauses the charger itself, following the plan, Charge now and
      the rules on the Control tab, with the start/stop method chosen there.
      The charging current is not changed. Turn off your own charging
      automation, or the two will fight.
  refresh_minutes:
    name: Refresh interval (minutes)
    description: >-
      How often the app reads prices, departures and states from Home Assistant
      and recalculates the plan in the background, between 1 and 60 minutes.
  allow_calendar_write:
    name: Allow adding trips to calendar
    description: >-
      When off (default), "Add trip" only shows which calendar events it would
      create (test mode) and writes nothing. When on, trips are added to the
      calendar chosen on the Departures tab. This does not allow any charger
      control.
  loss_percent:
    name: Charging loss margin (%)
    description: >-
      Extra energy to plan for, because not all energy from the charger ends up
      in the battery. 10 % is a good start.
  continuous_charging:
    name: Prefer one continuous charging period
    description: >-
      Charge in one go instead of in several short periods, unless splitting
      saves at least the amount below.
  min_split_saving:
    name: Split only when it saves at least
    description: >-
      Amount in your currency (for example 0.50). Only used when "Prefer one
      continuous charging period" is on.
  use_house_load:
    name: Account for house load
    description: >-
      Uses the last 14 days of your grid meter to estimate how much current is
      left for the charger under your main fuse at each hour. Needs the grid
      meter to be set up in the app.

configuration:
  log_level:
    name: Log level
    description: How much the app writes to its log. Use debug when reporting a problem.
  allow_control:
    name: Allow control
    description: >-
      Master switch, off by default. When off, the app only shows advice and
      never changes your charger, vehicle or home battery. When on, only "Charge
      now" and the manual test on the Control tab really start and stop the
      charger, with the start/stop method chosen on the Control tab. The
      charging plan itself stays a dry run. Turn off your own charging
      automation while testing.
  refresh_minutes:
    name: Refresh interval (minutes)
    description: >-
      How often the app reads prices, departures and states from Home Assistant
      and recalculates the plan in the background, between 1 and 60 minutes.
  allow_calendar_write:
    name: Allow adding trips to calendar
    description: >-
      When off (default), "Add trip" only shows which calendar events it would
      create (test mode) and writes nothing. When on, trips are added to the
      calendar chosen on the Departures tab. This does not allow any charger
      control.

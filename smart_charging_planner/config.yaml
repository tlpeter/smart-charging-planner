name: Smart Charging Planner
version: "0.21.2"
slug: smart_charging_planner
description: Plans EV and home battery charging around dynamic electricity prices.
url: https://github.com/tlpeter/smart-charging-planner
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: Smart Charging
homeassistant_api: true
options:
  allow_control: false
  allow_calendar_write: false
  publish_sensors: false
  notify_start_stop: true
  loss_percent: 10
  continuous_charging: true
  min_split_saving: 0.5
  use_house_load: true
  refresh_minutes: 5
  log_level: info
schema:
  allow_control: bool
  allow_calendar_write: bool
  publish_sensors: bool
  notify_start_stop: bool
  loss_percent: int(0,30)
  continuous_charging: bool
  min_split_saving: float(0,20)
  use_house_load: bool
  refresh_minutes: int(1,60)
  log_level: list(debug|info|warning|error)

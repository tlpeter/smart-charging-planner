<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Charging Planner</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #5f6672;
      --border: #dde1e6;
      --good: #1f8a4c;
      --bad: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b1f25;
        --text: #e8eaed;
        --muted: #9aa1ab;
        --border: #2c323a;
        --good: #3ccf7a;
        --bad: #ff6b5b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    .ok { color: var(--good); font-weight: 600; }
    .fail { color: var(--bad); font-weight: 600; }
    .error { color: var(--bad); margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Smart Charging Planner</h1>
    <p class="sub">Connection check</p>
    <div class="card">
      <div class="row"><span class="label">Home Assistant</span><span id="conn">Checking…</span></div>
      <div class="row"><span class="label">Home Assistant version</span><span id="haver">–</span></div>
      <div class="row"><span class="label">Entities found</span><span id="count">–</span></div>
      <div class="row"><span class="label">App version</span><span id="appver">–</span></div>
      <div id="error" class="error" hidden></div>
    </div>
  </main>
  <script>
    // Relative URL: required so the request goes through the ingress path.
    async function load() {
      const conn = document.getElementById('conn');
      const errorBox = document.getElementById('error');
      try {
        const res = await fetch('api/status');
        const s = await res.json();
        conn.textContent = s.connected ? 'Connected' : 'Not connected';
        conn.className = s.connected ? 'ok' : 'fail';
        document.getElementById('haver').textContent = s.ha_version || '–';
        document.getElementById('count').textContent = s.entity_count ?? '–';
        document.getElementById('appver').textContent = s.app_version || '–';
        errorBox.hidden = !s.error;
        errorBox.textContent = s.error || '';
      } catch (err) {
        conn.textContent = 'App not reachable';
        conn.className = 'fail';
      }
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
